<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookings — DormFlow</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <!-- Shared navigation bar (same markup on every page) -->
    <header class="site-header">
      <nav class="navbar">
        <a class="brand" href="/">DormFlow</a>
        <ul class="nav-links">
          <li><a href="/">Home</a></li>
          <li><a href="/requests.html">Requests</a></li>
          <li><a href="/bookings.html">Bookings</a></li>
          <li><a href="/announcements.html">Announcements</a></li>
          <li><a href="/activity.html">Activity</a></li>
          <li><a href="/login.html">Login</a></li>
          <li><a href="/register.html">Register</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h1 class="page-title">Facility bookings</h1>

      <!-- Facilities: filled from the API by js/bookings.js -->
      <section class="list-section">
        <h2>Available facilities</h2>
        <ul class="facility-list" id="facility-list"></ul>
      </section>

      <!-- Booking form. The facility list is filled from the API. -->
      <section class="form-section">
        <h2>New booking</h2>
        <form class="form" id="booking-form">
          <div class="form-group">
            <label for="facility">Facility</label>
            <select id="facility" name="facility"></select>
          </div>
          <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" name="date" required />
          </div>
          <div class="form-group">
            <label for="startTime">Start time</label>
            <input type="time" id="startTime" name="startTime" required />
          </div>
          <div class="form-group">
            <label for="endTime">End time</label>
            <input type="time" id="endTime" name="endTime" required />
          </div>
          <button type="submit" class="btn btn-primary">Book slot</button>
        </form>
        <p id="form-message" class="message"></p>
      </section>

      <!-- Bookings list: filled from the API by js/bookings.js -->
      <section class="list-section">
        <h2>My bookings</h2>
        <ul class="booking-list" id="booking-list"></ul>
      </section>
    </main>

    <footer class="site-footer">
      <p>DormFlow — student project</p>
    </footer>

    <script src="/js/auth.js"></script>
    <script src="/js/bookings.js"></script>
  </body>
</html>
