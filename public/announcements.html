<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Announcements — DormFlow</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <!-- Shared navigation bar (same markup on every page) -->
    <header class="site-header">
      <nav class="navbar">
        <a class="brand" href="/">DormFlow</a>
        <ul class="nav-links">
          <li><a href="/">Home</a></li>
          <li><a href="/requests.html">Requests</a></li>
          <li><a href="/bookings.html">Bookings</a></li>
          <li><a href="/announcements.html">Announcements</a></li>
          <li><a href="/activity.html">Activity</a></li>
          <li><a href="/login.html">Login</a></li>
          <li><a href="/register.html">Register</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h1 class="page-title">Announcements</h1>

      <!-- Only administrators see this form -->
      <section class="form-section" id="admin-section" hidden>
        <h2>New announcement</h2>
        <form class="form" id="announcement-form">
          <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required />
          </div>
          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category">
              <option>General</option>
              <option>Facilities</option>
              <option>Maintenance</option>
              <option>Events</option>
            </select>
          </div>
          <div class="form-group">
            <label for="content">Content</label>
            <textarea id="content" name="content" rows="3" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Publish</button>
        </form>
        <p id="form-message" class="message"></p>
      </section>

      <!-- Announcements: filled from the API by js/announcements.js -->
      <section class="list-section">
        <ul class="announcement-list" id="announcement-list"></ul>
      </section>
    </main>

    <footer class="site-footer">
      <p>DormFlow — student project</p>
    </footer>

    <script src="/js/auth.js"></script>
    <script src="/js/announcements.js"></script>
  </body>
</html>
