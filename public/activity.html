<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activity — DormFlow</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <!-- Shared navigation bar (same markup on every page) -->
    <header class="site-header">
      <nav class="navbar">
        <a class="brand" href="/">DormFlow</a>
        <ul class="nav-links">
          <li><a href="/">Home</a></li>
          <li><a href="/requests.html">Requests</a></li>
          <li><a href="/bookings.html">Bookings</a></li>
          <li><a href="/announcements.html">Announcements</a></li>
          <li><a href="/activity.html">Activity</a></li>
          <li><a href="/login.html">Login</a></li>
          <li><a href="/register.html">Register</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h1 class="page-title">My activity</h1>

      <!-- All lists are filled from the API by js/activity.js -->

      <section class="list-section">
        <h2>My requests</h2>
        <ul class="request-list" id="activity-requests"></ul>
      </section>

      <section class="list-section">
        <h2>Upcoming bookings</h2>
        <ul class="booking-list" id="upcoming-bookings"></ul>
      </section>

      <section class="list-section">
        <h2>Past bookings</h2>
        <ul class="booking-list" id="past-bookings"></ul>
      </section>

      <section class="list-section">
        <h2>Recent status changes</h2>
        <ul class="history-list" id="status-changes"></ul>
      </section>
    </main>

    <footer class="site-footer">
      <p>DormFlow — student project</p>
    </footer>

    <script src="/js/auth.js"></script>
    <script src="/js/activity.js"></script>
  </body>
</html>
