<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Requests — DormFlow</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <!-- Shared navigation bar (same markup on every page) -->
    <header class="site-header">
      <nav class="navbar">
        <a class="brand" href="/">DormFlow</a>
        <ul class="nav-links">
          <li><a href="/">Home</a></li>
          <li><a href="/requests.html">Requests</a></li>
          <li><a href="/bookings.html">Bookings</a></li>
          <li><a href="/announcements.html">Announcements</a></li>
          <li><a href="/activity.html">Activity</a></li>
          <li><a href="/login.html">Login</a></li>
          <li><a href="/register.html">Register</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h1 class="page-title">Maintenance requests</h1>

      <!-- Create request form. Not connected yet; wired to the API in Phase 3. -->
      <section class="form-section">
        <h2>New request</h2>
        <form class="form" id="request-form">
          <div class="form-group">
            <label for="resident">Your name</label>
            <input type="text" id="resident" name="resident" required />
          </div>
          <div class="form-group">
            <label for="roomNumber">Room number</label>
            <input type="text" id="roomNumber" name="roomNumber" required />
          </div>
          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category">
              <option>Plumbing</option>
              <option>Electricity</option>
              <option>Heating</option>
              <option>Furniture</option>
              <option>Internet</option>
              <option>Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="priority">Priority</label>
            <select id="priority" name="priority">
              <option>Low</option>
              <option>Medium</option>
              <option>High</option>
              <option>Urgent</option>
            </select>
          </div>
          <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Submit request</button>
        </form>
        <p id="form-message" class="message"></p>
      </section>

      <!-- Requests list: filled from the API by js/requests.js -->
      <section class="list-section">
        <h2>All requests</h2>
        <ul class="request-list" id="request-list"></ul>
      </section>
    </main>

    <footer class="site-footer">
      <p>DormFlow — student project</p>
    </footer>

    <script src="/js/requests.js"></script>
  </body>
</html>
