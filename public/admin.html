<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin — DormFlow</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <!-- Shared navigation bar (same markup on every page) -->
    <header class="site-header">
      <nav class="navbar">
        <a class="brand" href="/">DormFlow</a>
        <ul class="nav-links">
          <li><a href="/">Home</a></li>
          <li><a href="/requests.html">Requests</a></li>
          <li><a href="/bookings.html">Bookings</a></li>
          <li><a href="/announcements.html">Announcements</a></li>
          <li><a href="/activity.html">Activity</a></li>
          <li><a href="/login.html">Login</a></li>
          <li><a href="/register.html">Register</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h1 class="page-title">Admin dashboard</h1>
      <p id="admin-message" class="message"></p>

      <div id="dashboard" hidden>
        <section class="list-section">
          <h2>Overview</h2>
          <div class="stats" id="stats"></div>
        </section>

        <section class="list-section">
          <h2>Requests</h2>

          <form class="filters" id="filter-form">
            <select id="filter-status" aria-label="Filter by status">
              <option value="">All statuses</option>
              <option>Submitted</option>
              <option>Reviewed</option>
              <option>In Progress</option>
              <option>Completed</option>
              <option>Rejected</option>
              <option>Cancelled</option>
            </select>
            <select id="filter-category" aria-label="Filter by category">
              <option value="">All categories</option>
              <option>Plumbing</option>
              <option>Electricity</option>
              <option>Heating</option>
              <option>Furniture</option>
              <option>Internet</option>
              <option>Other</option>
            </select>
            <input
              type="search"
              id="filter-q"
              placeholder="Search description or room"
              aria-label="Search"
            />
            <button type="submit" class="btn btn-primary">Apply</button>
            <button type="button" class="btn btn-secondary" id="reset-filters">
              Reset
            </button>
          </form>

          <div class="table-wrap">
            <table class="table" id="requests-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Room</th>
                  <th>Category</th>
                  <th>Priority</th>
                  <th>Status</th>
                  <th>Description</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <p>DormFlow — student project</p>
    </footer>

    <script src="/js/auth.js"></script>
    <script src="/js/admin.js"></script>
  </body>
</html>
